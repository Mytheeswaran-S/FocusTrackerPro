<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Focus Tracker Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 50px 60px;
            width: 500px;
            backdrop-filter: blur(10px);
            color: white;
        }
        .back-btn {
            color: #64ffda;
            text-decoration: none;
            font-size: 14px;
            display: block;
            margin-bottom: 30px;
        }
        .logo { font-size: 40px; text-align: center; margin-bottom: 10px; }
        h2 {
            text-align: center;
            font-size: 28px;
            color: #e94560;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 35px;
        }
        .staff-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px 25px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .staff-card .info h4 { color: #64ffda; font-size: 16px; }
        .staff-card .info p { color: #8892b0; font-size: 13px; margin-top: 3px; }
        .staff-card .password {
            background: rgba(233,69,96,0.2);
            border: 1px solid #e94560;
            color: #e94560;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .note {
            margin-top: 25px;
            padding: 15px;
            background: rgba(100,255,218,0.05);
            border-radius: 10px;
            border: 1px solid rgba(100,255,218,0.1);
            color: #8892b0;
            font-size: 13px;
            text-align: center;
            line-height: 1.8;
        }
        .btn-back {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 25px;
            text-align: center;
            text-decoration: none;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(233,69,96,0.4);
        }
    </style>
</head>
<body>
    <div class="card">
        <a href="/login" class="back-btn">← Back to Login</a>
        <div class="logo">🔑</div>
        <h2>Forgot Password</h2>
        <p class="subtitle">Default passwords for all advisors</p>

        <div class="staff-card">
            <div class="info">
                <h4>Sathiyapriya Mam</h4>
                <p>Class: IT-A</p>
            </div>
            <div class="password">Sathiya@ITA</div>
        </div>

        <div class="staff-card">
            <div class="info">
                <h4>Gowsalya Mam</h4>
                <p>Class: IT-B</p>
            </div>
            <div class="password">Gowsalya@ITB</div>
        </div>

        <div class="staff-card">
            <div class="info">
                <h4>Sageetha Mam</h4>
                <p>Class: IT-C</p>
            </div>
            <div class="password">Sageetha@ITC</div>
        </div>

        <div class="note">
            ⚠️ Please contact the system administrator<br>
            if you need to reset your password.
        </div>

        <a href="/login" class="btn-back">← Back to Login</a>
    </div>
</body>
</html>
